version: "2"
run:
  allow-parallel-runners: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
linters:
  default: all
  enable:
    - wsl_v5
  disable:
    - exhaustruct
    # Deprecated since golangci-lint v2.12.0; `default: all` already runs its
    # replacement, gomodguard_v2, on releases that ship it. Disabling the old
    # name keeps every v2 release working, since no release rejects it.
    - gomodguard
    - wsl
  exclusions:
    paths:
      # Exclude auto-generated mock files from all linting rules
      - ".*mocks.*\\.go$"
      - ".*_mocks_.*\\.go$"
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
    depguard:
      rules:
        main:
          files:
            - "$all"
            - "!$test"
          list-mode: strict
          allow:
            - $gostd
            # This module's own packages. Everything else stays stdlib-only;
            # adding a dependency needs a stated reason (see AGENTS.md).
            - github.com/devantler-tech/bookkeeper
